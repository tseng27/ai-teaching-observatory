.hero:before{content:"";position:absolute;pointer-events:none;inset:0;background:radial-gradient(circle at 30% 35%,rgba(190,160,112,.14),transparent 56%);z-index:0}
.hero > *{position:relative;z-index:1}
.hero .eyebrow{color:#b9a180;letter-spacing:.26em;font-size:11px;font-weight:600}
.hero h1{color:#f2efe9;letter-spacing:-.048em;font-size:clamp(50px,5.1vw,78px);font-weight:660;line-height:1.22;margin:27px 0 24px;max-width:700px}
.hero-description{color:#c2bcb1;font-size:16px;max-width:510px;line-height:2.0;font-weight:370}
.pill-row{gap:8px;margin-top:30px}
.pill{background:transparent;color:#c9bb9f;border:1px solid #5c574d;border-radius:3px;font-weight:550;letter-spacing:.035em;padding:7px 10px;font-size:11px}
.hero-photo-strip{height:206px;margin-top:46px;max-width:680px;gap:7px}
.hero-photo-strip .photo-tile img{border-radius:0;filter:grayscale(.3) contrast(1.14);transition:filter .28s,transform .3s}
.hero-photo-strip .photo-tile{overflow:hidden}
.hero-photo-strip .photo-tile:hover img{filter:grayscale(0) contrast(1.1);transform:scale(1.035)}
.photo-tile span{border-radius:0;background:#1c1c19ac;color:#e5ddcf;font-weight:500;letter-spacing:.09em;text-transform:uppercase}
.join-card{background:#f3f0e9;border:1px solid #d3c9b9;box-shadow:0 32px 74px #0006;border-radius:3px;padding:40px 37px;max-width:470px}
.join-card .eyebrow{color:#8b724f}
.join-card h2{font-size:30px;letter-spacing:-.045em;font-weight:650}
.join-card .desc{color:#7a756c}
.field label{color:#37342d;font-weight:620}
.field .hint{color:#847f77}
.text-input{border:1px solid #cdc5b8;border-radius:2px;box-shadow:none;background:#fbfaf7;color:#292720}
.text-input:focus{border-color:#92765b;box-shadow:0 0 0 3px #b8a38733}
.text-input::placeholder{color:#9f998e}
.btn{background:#a88e6c;color:#171916;border-color:#a88e6c;border-radius:2px;font-weight:690;letter-spacing:.028em;box-shadow:none;transition:.22s ease}
.btn:hover:not(:disabled){background:#c0a47e;color:#171916;box-shadow:0 9px 24px #48392633}
.btn.secondary{background:transparent;border-color:#b2a997;color:#504332}
.btn.secondary:hover{background:#e6dfd1;color:#322c21}
.btn.ghost{color:#665f55;border-color:transparent}
.btn.ghost:hover{background:#e7e3dc;color:#302e29}
.btn.danger{background:#fff;border-color:#d9b4b4;color:#a53f45}
.home-footer{color:#aba294}
.stage-shell,.teacher-wrap{background:#ebe9e3}
.stage-layout{padding-top:42px}
.sidebar{border-radius:2px;border-color:#ded8ce;box-shadow:none;padding:25px 14px}
.student-meta{border-color:#e7e2d9}
.sidebar-kicker{letter-spacing:.20em;color:#87745c}
.student-meta span,.progress-label{color:#817b72}
.progress-track{background:#e8e1d6;border-radius:0;height:4px}
.progress-fill{background:#ab906d;border-radius:0}
.side-step{color:#645e55;border-radius:2px;font-weight:550}
.side-step:hover{background:#f7f4ef}
.side-step.active{background:#e9e0d2;color:#655039}
.step-num{border-radius:1px;background:#efebe4;color:#777064}
.side-step.active .step-num{background:#b19874;color:#fff}
.stage-card{border-radius:2px;border-color:#ded9d0;box-shadow:none}
.learning-header .crumb{color:#6e685f;letter-spacing:.035em}
.stage-top{padding-top:44px}
.stage-top .eyebrow{letter-spacing:.24em;color:#937955;font-weight:640}
.stage-top h1{font-size:clamp(30px,3.4vw,43px);font-weight:670;letter-spacing:-.045em}
.stage-top p{color:#716e66}
.hero-visual{height:355px;border-radius:0;background:#d7d2cb}
.hero-visual img{filter:contrast(1.08) saturate(.68)}
.visual-overlay{padding:100px 27px 25px;background:linear-gradient(transparent,#161715cc)}
.visual-overlay strong{font-size:23px;font-weight:590}
.section-title{font-size:20px;font-weight:670}
.section-title .number{background:#c6b297;color:#302b24;border-radius:1px}
.reading{background:#f4f1eb;border:1px solid #e6dfd4;border-radius:2px;color:#5d5850;padding:27px 30px}
.reading strong{color:#2b2823}
.question-label{color:#292720;font-weight:660}
.choice{border:1px solid #dcd4ca;border-radius:1px;color:#524b43}
.choice:has(input:checked){border-color:#b39870;background:#f0e8dc;color:#4b3d2b}
.choice input,.checkbox-row input{accent-color:#9d825f}
.choice strong{color:#3e3930}
.toolbox{background:#f4f1ea;border-color:#e4ddd4;border-radius:2px}
.seg{background:#e7dfd3;border-radius:1px}
.seg button{border-radius:1px;color:#6e6352}
.seg button.active{color:#45372a;box-shadow:none}
.crop-viewport,.upload-preview{border-radius:1px}
.upload-box{border-color:#ac987d;background:#f9f6f0;border-radius:1px}
.upload-box:hover{background:#f3eee5}
.upload-box strong{color:#67503b}
.upload-box .upload-icon{color:#997954}
.activity-note{background:#f5eee3;border-left-color:#a68a67;color:#5e564d;border-radius:0}
.task-actions{background:#fff;border-top-color:#e9e2d9}
.result-preview{background:#f7f3ec;border-color:#e5dbcd;border-radius:2px}
.stat,.table-card{border-radius:2px;border-color:#ded8cc;box-shadow:none}
.teacher-header .eyebrow{letter-spacing:.22em}
.teacher-header h1{font-weight:650;letter-spacing:-.04em}
.notice{border-radius:1px}
.table-pill{border-radius:1px;background:#eee8dd}
th{background:#f7f4ef;color:#696154}
td{color:#474138}
.toast{border-radius:1px;background:#23211e}
.overlay{background:#111111b8}
.modal,.modal-top,.modal-body{border-radius:2px}
.modal-body{background:#e9e6df}
.paper{color:#252522}
.paper .paper-kicker{color:#957550}
.paper h3{color:#4f4333}
.paper .paper-photo{border-radius:1px}
@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:58px}.hero h1{font-size:clamp(47px,9vw,68px)}.join-card{max-width:none}.hero-photo-strip{height:200px}}
@media(max-width:560px){.header{height:62px}.hero{padding-top:42px;padding-bottom:42px}.hero h1{font-size:46px}.hero-photo-strip{height:138px;margin-top:25px}.join-card{padding:28px 22px}.hero-description{font-size:14px}.stage-top{padding-top:29px}.stage-top h1{font-size:29px}.hero-visual{height:230px}.reading{padding:19px 17px}}
@media print{.paper .paper-kicker{color:#7d6448}.paper h3{color:#473a2b}.paper{background:white}.paper h1{font-weight:670}}


/* V3: first-hand campus observation and Tanaka miniature fieldwork */
.micro-guide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0 26px}
.micro-guide>div{border:1px solid #d5d1ca;background:#f8f6f1;padding:20px 19px;border-radius:11px;min-height:102px}
.micro-guide b{display:block;font-size:14px;color:#342d27;letter-spacing:.02em;margin-bottom:7px}
.micro-guide span{font-size:13px;color:#66615a;line-height:1.7}
.campus-upload{width:100%;max-width:660px;min-height:235px;margin:12px 0}
.campus-upload img{width:100%;height:auto;max-height:420px;object-fit:contain}
.link-panel{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:24px;margin:12px 0 25px;background:#eeeae2;border-left:3px solid #ba9b70;border-radius:8px}
.link-panel strong{color:#302c26;font-size:17px}
.link-panel p{font-size:13px;line-height:1.8;color:#615d57;margin-top:9px;max-width:560px}
.link-panel a.btn{white-space:nowrap;text-decoration:none}

.sony-card .link-panel{background:#fff}.sony-disclaimer{padding-top:14px;border-top:1px solid #ddd7cc;font-size:12px!important;color:#665f53!important}

.sony-compare img{width:100%;height:200px;object-fit:contain;background:#242525}
.sony-compare p{font-size:13px;color:#69685f;margin:auto;padding:30px 16px;text-align:center}

  function home(){return `<main><div class="page-width hero"><section class="hero-copy"><div class="eyebrow">校園即時攝影 × Sony α7 III × 微縮藝術 · 高中美術自主學習</div><h1>重新學會觀看，<br>拍出你的世界。</h1><p class="hero-description">每一張照片，不只是畫面的紀錄，也是你選擇如何觀看世界的方式。現在先用手機走進校園拍照，再學會操作分配到的 Sony α7 III 重新拍攝，最後透過田中達也微縮藝術的啟發，創造屬於自己的影像故事。</p><div class="pill-row">${stages.map((s,i)=>`<span class="pill">${String(i+1).padStart(2,'0')} ${e(s.name)}</span>`).join('')}</div><div class="hero-photo-strip"><div class="photo-tile"><img src="${photo('coffee')}" alt="咖啡杯與桌上光影的攝影示範"><span>看見日常</span></div><div class="photo-tile"><img src="${photo('camera')}" alt="經典黑白紀實攝影示範"><span>理解攝影</span></div><div class="photo-tile"><img src="${photo('astronaut')}" alt="太空人影像範例"><span>擴展視野</span></div></div></section><section class="join-card"><div class="eyebrow">JOIN THE CLASS · 加入課堂</div><h2>你的攝影挑戰從這裡開始</h2><p class="desc">輸入課堂代碼與姓名，開始新的探索，或接續之前在本機完成的作業。</p><form id="joinForm"><div class="field"><label for="classCode">課堂代碼</label><input id="classCode" class="text-input" name="classCode" placeholder="輸入課堂代碼" value="${CLASS_CODE}" required maxlength="16" autocomplete="off"></div><div class="field"><label for="studentName">姓名／測試暱稱</label><input id="studentName" class="text-input" name="name" placeholder="輸入你的姓名或測試暱稱" required maxlength="36" autocomplete="off"></div><div class="field"><label for="studentId">學號／座號 <span class="hint">選填</span></label><input id="studentId" class="text-input" name="studentId" placeholder="建議測試時填入座號" maxlength="24" autocomplete="off"></div><div class="join-buttons"><button class="btn full" type="submit">開始／繼續我的攝影探索 ${icon('arrow')}</button><button class="btn secondary full" type="button" data-action="demo">${icon('eye')} 使用示範身分立即體驗</button></div></form><p class="footnote">測試代碼：<strong>${CLASS_CODE}</strong>。本版僅儲存在目前瀏覽器，尚未開放真正的跨裝置同步與教師登入。</p></section></div><footer class="page-width home-footer"><span>© 攝影探索工作室 · 高中美術自主學習測試版</span><span>示範圖片：scikit-image 測試影像資料 · 正式上線請換成授權教材與學生原創作品</span></footer utton><button class="btn" data-action="preview">${icon('download')} 輸出 PDF ${icon('arrow')}</button>`:`<button class="btn secondary" data-action="next-skip">稍後完成</button><button class="btn" data-action="next">儲存並進入下一關 ${icon('arrow')}</button>`}</div></footer></article><p class="footnote">你可以從左側切換任務。回答會自動儲存在目前瀏覽器中，關閉後以相同代碼及身分可接續學習。</p></main></div></div>`}

    }else h+='<p class="ai-empty">先自己觀察：主體在哪裡？是否有引導線或留白？光線讓誰最突出？如果重拍，你想改變什麼？</p>';

  async function askAi(k){
    const r=getRec(),im=aiPhoto(k,r),uid=state.userKey;
    if(!im){toast('請先上傳作品');return}
    if(!state.aiConsent){toast('請先確認圖片傳送同意');return}
    if(state.aiStatus&&state.aiStatus.loading)return;
    state.aiStatus={kind:k,loading:true};render();
    try{
      const res=await fetch('/api/analyze-photo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:k,image:im}),cache:'no-store'});
      const data=await res.json().catch(()=>({}));
      if(!res.ok||!data.success)throw Error(data.message||'AI 服務暫時無法回應');
      if(!data.feedback||!Array.isArray(data.feedback.questions)||data.feedback.questions.length!==3)throw Error('AI 回應不完整');
      if(state.userKey!==uid||!getRec())return;
      const rec=getRec();rec.aiFeedbacks=rec.aiFeedbacks||{};const old=rec.aiFeedbacks[k];
      rec.aiFeedbacks[k]=data.feedback;
      for(let i=0;i<3;i++)delete rec.answers['aiAnswer_'+k+'_'+i];
      if(!writeStore()){rec.aiFeedbacks[k]=old;throw Error('瀏覽器儲存空間不足')}
      state.aiStatus=null;render();toast('AI 觀察完成，現在請自己回答');
    }catch(err){state.aiStatus={kind:k,loading:false,error:String(err.message||'分析暫時不可用').slice(0,140)};render()}
  }
  function clearAi(k,r){if(r.aiFeedbacks)delete r.aiFeedbacks[k];for(let i=0;i<3;i++)delete r.answers['aiAnswer_'+k+'_'+i];state.aiStatus=null}

  function stageBody(i){switch(i){

  function start(code,name,id){code=(code||'').trim().toUpperCase();name=(name||'').trim();id=(id||'').trim();if(code!==CLASS_CODE){toast('請輸入測試課堂代碼 PHOTO26');return}if(!name){toast('請輸入姓名或測試暱稱');return}const key=JSON.stringify([code,name,id]);if(!store.records[key]){store.records[key]={id:key,classCode:code,name,studentId:id,answers:{},photos:[null,null,null],campusPhoto:null,sonyPhoto:null,aiFeedbacks:{},createdAt:Date.now(),updatedAt:Date.now()};if(!writeStore()){delete store.records[key];return}}state.userKey=key;const rec=getRec();const first=stages.findIndex((_,i)=>!isDone(i,rec));go('learning',first===-1?5:first);toast('已載入你的本機學習紀錄')}
  function formative(field){
    if(field==='ethics'){
      const value=ans(field);
      if(!value)return '選擇一種做法後，這裡會給你一個值得思考的攝影倫理提醒。';
      return value==='先詢問'?'✓ 很好的起點：拍攝前說明目的、尊重拒絕，並考量後續展示可能造成的影響。':'再想想：影像可能影響真實的人。拍攝時應考量同意、尊嚴、故事脈絡，以及公開影像造成的後果。';
    }
    if(field==='sourceAction'){
      const value=ans(field);
      if(!value)return '選擇你的查證方法，看看如何從觀看進一步走向判斷。';
      return value==='來源'?'✓ 適當的查證起點：追查原始來源，並交叉比對拍攝時間、地點與可靠報導。':'提醒：外觀與情緒無法替代證據。試著追查影像來源、時間、地點與其他可驗證資料。';
    }
    return '';
  }

  function updateProgress(){const rec=getRec();if(!rec)return;const f=document.getElementById('progressFill');const l=document.getElementById('progressLabel');if(f)f.style.width=(progress()/6*100)+'%';if(l)l.textContent=`${progress()} / 6 個任務已完成`;document.querySelectorAll('.side-step').forEach((el,i)=>{const d=isDone(i);const v=el.querySelector('.step-done');if(d&&!v)el.insertAdjacentHTML('beforeend','<span class="step-done" aria-label="已完成">✓</span>');if(!d&&v)v.remove()});const status=document.getElementById('saveStatus');if(status)status.textContent=canPersist?'已儲存至此瀏覽器':'暫存模式 · 重開將遺失'}
  function next(allowSkip){if(!allowSkip&&!isDone(state.index)){toast('請先完成此關的必要回答；也可以選擇「稍後完成」。');return}if(state.index<5){go('learning',state.index+1);toast(allowSkip?'已保留這一關的草稿':'此關完成，已保存學習進度')}else openPreview()}
  function teacher(){const records=Object.values(store.records||{});const done=records.filter(r=>progress(r)===6).length;const avg=records.length?(records.reduce((sum,r)=>sum+progress(r),0)/records.length).toFixed(1):'0';return `<div class="teacher-wrap"><main class="page-width"><div class="teacher-header"><div class="eyebrow">TEACHER VIEW · 本機示範</div><h1>教師管理儀表板</h1><p class="muted">攝影探索工作室 · 測試課堂代碼 <strong>${CLASS_CODE}</strong></p></div><div class="notice">⚠️ <strong>重要：</strong>此頁只有前端示範，沒有教師帳號驗證，資料只來自<strong>目前這台裝置／這個瀏覽器</strong>。跨裝置收件、學生資料安全與 Google Drive 備份尚未實作。請勿當作真實班級的正式管理系統。</div><div class="stats"><div class="stat"><div class="stat-name">本機測試學習紀錄</div><div class="stat-num">${records.length}</div></div><div class="stat"><div class="stat-name">完成全部六關</div><div class="stat-num">${done}</div></div><div class="stat"><div class="stat-name">平均完成關卡數</div><div class="stat-num">${avg}<span class="small muted"> / 6</span></div></div></div><div class="teacher-actions"><button class="btn secondary small-btn" data-action="csv">${icon('download')} 匯出本機紀錄 CSV</button><button class="btn secondary small-btn" data-action="student-return">返回學生學習</button><button class="btn danger small-btn" data-action="clear-all">清除所有本機測試紀錄</button></div><div class="table-card"><h2>學生學習狀況 <span class="tiny muted">（此瀏覽器儲存）</span></h2>${records.length?`<div class="table-wrap"><table><thead><tr><th>學生</th><th>代碼／座號</th><th>完成進度</th><th>最近儲存</th><th>操作</th></tr></thead><tbody>${records.map(r=>`<tr><td><strong>${e(r.name)}</strong></td><td>${e(r.classCode)} · ${e(r.studentId||'—')}</td><td><span class="table-pill ${progress(r)===6?'real':''}">${progress(r)} / 6 關</span></td><td>${stamp(r.updatedAt)}</td><td><button class="btn secondary small-btn" data-action="open-record" data-key="${e(r.id)}">查看成果</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty-state">${icon('book')}<strong>還沒有本機測試紀錄</strong>請回首頁使用示範身分開始完成任務。</div>`}</div></main></div>`}
  function paperHtml(rec){const a=rec.answers||{};const val=k=>String(a[k]||'').trim()||'（尚未填寫）';const sections=[
  ['二、成果概述',`在「觀看的力量：校園觀察與微縮攝影」課程中，我在校園當場拍照，學習攝影構圖、光線與 CameraSim 模擬，再操作 Sony α7 III 以 P／A 模式重新拍攝；並欣賞田中達也的微縮攝影，向老師領取小人物，利用校園日常物件創作自己的微縮場景。最終比較手機與單眼相機照片，並完成一組微縮攝影作品。`],
  ['三、學習內容',`（1）校園即時攝影｜拍攝位置：${val('campusPlace')}。我當時的觀察與取景：${val('campusObservation')}。\n（2）攝影技法｜我注意的元素：${val('composition')}；構圖比較：${val('visualComparison')}；CameraSim 操作發現：${val('cameraSimFinding')}。
（3）Sony α7 III 操作｜器材：${val('cameraId')}；鏡頭：${val('cameraLens')}；六項操作完成：${[1,2,3,4,5,6].filter(n=>a['sonyCheck'+n]===true).length}/6；與手機比較：${val('sonyComparison')}。\n（4）影像理解｜攝影倫理：${val('ethics')}；影像查證：${val('sourceAction')}。\n（5）田中達也與微縮創作｜場景構想：${val('miniatureIdea')}；作品名稱：${val('workTitle')}；拍攝方法與表達：${val('workConcept')}。`],
  ['四、心得與省思',`我比較兩次攝影的發現：${val('reflection')}\n我最大的學習收穫：${val('growth')}\n自我評量：${val('selfRating')} / 5 分。`]
  ];
  const feedback=rec.aiFeedbacks||{};let aiText='';
  for(const kind of ['campus','sony','mini']){
    const f=feedback[kind];if(!f)continue;
    aiText+='\nAI 觀察：'+aiName(kind)+'（AI 線索非評分）。';
    aiText+='\n構圖：'+(f.composition||'')+'；光線：'+(f.lighting||'');
    (f.questions||[]).slice(0,3).forEach((q,i)=>aiText+='\n引導：'+q+'\n學生回答：'+val('aiAnswer_'+kind+'_'+i));
  }
  if(aiText)sections[1][1]+='\n（6）AI 影像觀察與自主回答｜'+aiText;
  const proofs=`<section class="paper-section"><h3>五、佐證資料</h3><p>01｜現在於校園拍攝的照片（本人原創）</p>${rec.campusPhoto?`<img class="paper-photo" src="${rec.campusPhoto}" alt="校園當下實拍作品">`:'<p>（尚未上傳）</p>'}<p>02｜Sony α7 III 重新拍攝校園場景（本人原創）</p>${rec.sonyPhoto?`<img class="paper-photo" src="${rec.sonyPhoto}" alt="Sony α7 III 校園實拍">`:'<p>（尚未上傳）</p>'}<p>03｜田中達也作品欣賞後，使用向老師領取的小人物所拍攝的微縮作品（本人原創）</p>${(rec.photos||[]).filter(Boolean).map((src,j)=>`<img class="paper-photo" src="${src}" alt="校園微縮作品 ${j+1}">`).join('')||'<p>（尚未上傳）</p>'}</section>`;
  return `<div class="paper"><div class="paper-kicker">PINGBEI HIGH SCHOOL · ART LEARNING PORTFOLIO</div><h1>國立屏北高級中學<br>課程學習成果</h1><div class="paper-meta"><strong>一、基本資料</strong><br>科目名稱：美術　｜　開課年級：一年級<br>單元／主題：觀看的力量—校園觀察與微縮攝影<br>課程時間：依授課教師安排　｜　指導教師：曾國正<br>學生姓名：${e(rec.name)}　｜　課堂代碼：${e(rec.classCode)}　｜　學號／座號：${e(rec.studentId||'未填')}<br>任務完成度：${progress(rec)} / 6　｜　匯出日期：${new Date().toLocaleDateString('zh-TW')}</div>${sections.map(([title,desc])=>`<section class="paper-section"><h3>${e(title)}</h3><p>${nl(desc)}</p></section>`).join('')}${proofs}<div class="paper-footer">課程學習成果依學校五大欄位編排。照片需為學生於課程中實際拍攝；測試版資料僅存在目前瀏覽器。</div></div>`}
  function openPreview(rec=getRec()){if(!rec){toast('請先開始學生學習，才能預覽成果');return}document.getElementById('printArea').innerHTML=paperHtml(rec);document.getElementById('overlayRoot').innerHTML=`<div class="overlay" data-action="close-on-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="學習成果預覽"><div class="modal-top"><div><div class="eyebrow">A4 LEARNING PORTFOLIO</div><h2>屏北高中課程學習成果預覽</h2><p class="small muted">目前完成 ${progress(rec)} / 6 關；未完成內容也會標示於預覽中。</p></div><button class="close-x" data-action="close-modal" aria-label="關閉預覽">×</button></div><div class="modal-body">${paperHtml(rec)}</div><div class="modal-actions"><button class="btn secondary" data-action="close-modal">返回編輯</button><button class="btn" data-action="print">${icon('download')} 列印／另存 PDF</button></div></section></div>`;}
  function showHelp(){document.getElementById('overlayRoot').innerHTML=`<div class="overlay" data-action="close-on-backdrop"><section class="modal" style="max-width:590px" role="dialog" aria-modal="true" aria-label="測試說明"><div class="modal-top"><div><div class="eyebrow">QUICK START</div><h2>如何測試攝影探索工作室？</h2></div><button class="close-x" data-action="close-modal" aria-label="關閉使用說明">×</button></div><div class="modal-body" style="background:white"><ol class="help-points"><li>點選首頁「使用示範身分立即體驗」，或使用代碼 <strong>PHOTO26</strong> 和自訂暱稱。</li><li>依照六個任務操作；可以隨時切換關卡，文字回答會自動保存在本機。</li><li>第二關可學習 Sony α7 III 的六項操作護照，並比較完整畫面、特寫與九宮格。第四關可以比較原始顯示與調色影像。</li><li>第一關由老師宣布出發後，立即到校園觀察、拍攝並上傳一張現在拍的照片。</li><li>第二關開啟 CameraSim 官方模擬器後，領取 Sony α7 III 實際操作並重拍校園；透過讀卡機或電腦轉入 JPG 再上傳。</li><li>第五關先欣賞田中達也官方作品，再向老師領取小人物，於校園實拍 1～3 張並歸還。</li><li>第六關完成反思後，開啟成果預覽，按「列印／另存 PDF」。</li><li>按右上方「教師管理」，能查看同一瀏覽器中建立的測試紀錄。</li></ol><div class="notice" style="margin-top:18px">正式給學生使用前，需新增真正的使用者驗證、伺服器資料庫、教師授權、雲端存圖與安全備份。本版僅供介面與教學流程試用。</div></div><div class="modal-actions"><button class="btn" data-action="close-modal">了解，開始測試</button></div></section></div>`}
  function closeModal(){document.getElementById('overlayRoot').innerHTML=''}
  async function upload(file,index){if(!file)return;if(!file.type.startsWith('image/')){toast('請選擇圖片檔案');return}if(file.size>12*1024*1024){toast('檔案超過 12MB，請先縮小');return}try{const data=await toJpeg(file);const rec=getRec();if(!rec)return;const isCampus=index===-1,isSony=index===-2;const old=isCampus?rec.campusPhoto:isSony?rec.sonyPhoto:rec.photos[index];if(isCampus)rec.campusPhoto=data;else if(isSony)rec.sonyPhoto=data;else rec.photos[index]=data;clearAi(isCampus?'campus':isSony?'sony':'mini',rec);rec.updatedAt=Date.now();if(!writeStore()){if(isCampus)rec.campusPhoto=old;else if(isSony)rec.sonyPhoto=old;else rec.photos[index]=old;return}render();toast('現場照片已儲存於此瀏覽器')}catch(err){console.error(err);toast('無法處理圖片，請使用 JPG 或 PNG')}}
  function toJpeg(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{try{const scale=Math.min(1,1100/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*scale));c.height=Math.max(1,Math.round(im.naturalHeight*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.72))}catch(err){URL.revokeObjectURL(url);reject(err)}};im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('圖片無法讀取'))};im.src=url})}
  function csvValue(s){let v=String(s==null?'':s);if(/^[\s]*[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
  function exportCsv(){const records=Object.values(store.records);if(!records.length){toast('目前沒有可匯出的本機測試紀錄');return}const cols=['name','studentId','classCode','updatedAt','completed','campusPlace','campusObservation','cameraId','cameraLens','sonyCheck1','sonyCheck2','sonyCheck3','sonyCheck4','sonyCheck5','sonyCheck6','sonyComparison','composition','visualComparison','cameraSimFinding','ethics','socialQuestion','sourceAction','verificationReason','miniatureIdea','workTitle','workConcept','selfRating','reflection','growth'];const rows=[cols.join(',')];for(const r of records){rows.push(cols.map(k=>csvValue(k==='completed'?progress(r):k==='updatedAt'?stamp(r.updatedAt):Object.hasOwn(r,k)?r[k]:r.answers[k])).join(','))}const blob=new Blob(['\uFEFF'+rows.join('\r\n')],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='攝影探索工作室_本機學習紀錄.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已匯出本機測試紀錄 CSV')}
  document.addEventListener('submit',ev=>{if(ev.target.id==='joinForm'){ev.preventDefault();const fd=new FormData(ev.target);start(fd.get('classCode'),fd.get('name'),fd.get('studentId'))}});
  document.addEventListener('input',ev=>{const k=ev.target.dataset.field;if(!k)return;if(ev.target.type==='radio')return;saveField(k,ev.target.value)});
  document.addEventListener('change',ev=>{if(ev.target.dataset.aiConsent!==undefined){state.aiConsent=ev.target.checked;const b=document.querySelector('[data-action="ai-analyze"]');if(b)b.disabled=!state.aiConsent;return}if(ev.target.dataset.sonyUpload!==undefined){upload(ev.target.files?.[0],-2);return}if(ev.target.dataset.campusUpload!==undefined){upload(ev.target.files?.[0],-1);return}if(ev.target.dataset.upload!==undefined){upload(ev.target.files?.[0],Number(ev.target.dataset.upload));return}const k=ev.target.dataset.field;if(k)saveField(k,ev.target.type==='checkbox'?ev.target.checked:ev.target.value)});
  document.addEventListener('click',ev=>{const btn=ev.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action;
    if(action==='ai-analyze'){askAi(btn.dataset.kind);return}
    if(action==='close-on-backdrop'){if(ev.target===btn)closeModal();return}
    if(action==='close-modal'){closeModal();return}
    if(action==='print'){window.print();return}
    if(action==='help'){showHelp();return}
    if(action==='home'){go('home');return}
    if(action==='demo'){start(CLASS_CODE,'攝影體驗同學','01');return}
    if(action==='teacher'){go('teacher');return}
    if(action==='student-return'){go(state.userKey?'learning':'home',state.index);return}
    if(action==='step'){go('learning',Number(btn.dataset.index));return}
    if(action==='prev'){go('learning',Math.max(0,state.index-1));return}
    if(action==='next'){next(false);return}
    if(action==='next-skip'){next(true);return}
    if(action==='preview'){openPreview();return}
    if(action==='crop-all'||action==='crop-close'||action==='grid'){if(action==='grid')state.grid=!state.grid;else state.crop=action==='crop-all'?'all':'close';document.querySelectorAll('[data-action^="crop-"]').forEach(x=>x.classList.toggle('active',(x.dataset.action==='crop-all'&&state.crop==='all')||(x.dataset.action==='crop-close'&&state.crop==='close')));document.querySelector('[data-action="grid"]')?.classList.toggle('active',state.grid);const v=document.getElementById('cropViewport');if(v){v.classList.toggle('zoomed',state.crop==='close');v.classList.toggle('grid-on',state.grid)}return}
    if(action==='edit-original'||action==='edit-adjusted'){state.edit=action==='edit-original'?'original':'adjusted';document.querySelectorAll('[data-action^="edit-"]').forEach(x=>x.classList.toggle('active',x.dataset.action===action));document.getElementById('editViewport')?.classList.toggle('adjusted',state.edit==='adjusted');return}
    if(action==='remove-sony-photo'){const r=getRec();if(!r)return;const old=r.sonyPhoto;r.sonyPhoto=null;if(!writeStore()){r.sonyPhoto=old;return}render();toast('已移除 Sony α7 III 作品');return}
    if(action==='remove-campus-photo'){const r=getRec();if(!r)return;const old=r.campusPhoto;r.campusPhoto=null;clearAi('campus',r);if(!writeStore()){r.campusPhoto=old;return}render();toast('已移除校園實拍照片');return}
    if(action==='remove-photo'){const r=getRec();if(!r)return;const i=Number(btn.dataset.index);const old=r.photos[i];r.photos[i]=null;clearAi('mini',r);if(!writeStore()){r.photos[i]=old;return}render();toast('已移除照片');return}
    if(action==='csv'){exportCsv();return}
    if(action==='clear-all'){if(confirm('確定清除這個瀏覽器中的所有攝影測試紀錄？此操作無法復原。')){store={records:{}};state.userKey=null;writeStore();render();toast('已清除本機紀錄')}return}
    if(action==='open-record'){const r=store.records[btn.dataset.key];if(r)openPreview(r);return}
  });
  document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});
  render();
})();
</script>
