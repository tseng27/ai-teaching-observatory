<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="title desc">
<title id="title">AI 教學觀察所金色識別標誌</title>
<desc id="desc">由開放書本、放大鏡、燈泡與電路節點構成的金色立體識別</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff0a8"/>
    <stop offset=".22" stop-color="#ffd75a"/>
    <stop offset=".5" stop-color="#d88a14"/>
    <stop offset=".76" stop-color="#ffcf48"/>
    <stop offset="1" stop-color="#7f4109"/>
  </linearGradient>
  <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe994"/>
    <stop offset=".45" stop-color="#d99524"/>
    <stop offset="1" stop-color="#8a4a10"/>
  </linearGradient>
  <linearGradient id="bookFill" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eab04a"/>
    <stop offset=".58" stop-color="#a75c14"/>
    <stop offset="1" stop-color="#6b330b"/>
  </linearGradient>
  <radialGradient id="halo" cx="50%" cy="47%" r="58%">
    <stop offset="0" stop-color="#ffd768" stop-opacity=".58"/>
    <stop offset=".48" stop-color="#d3921d" stop-opacity=".18"/>
    <stop offset="1" stop-color="#a46712" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
    <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#4f2805" flood-opacity=".34"/>
  </filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="12" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<ellipse cx="280" cy="228" rx="245" ry="205" fill="url(#halo)"/>
<g filter="url(#shadow)" stroke-linejoin="round" stroke-linecap="round">
  <!-- book body -->
  <path d="M52 156 Q132 135 264 194 L264 357 Q150 300 52 318 Z" fill="url(#bookFill)" stroke="url(#gold)" stroke-width="14"/>
  <path d="M508 156 Q428 135 296 194 L296 357 Q410 300 508 318 Z" fill="url(#bookFill)" stroke="url(#gold)" stroke-width="14"/>
  <path d="M64 333 Q155 320 272 378" fill="none" stroke="#f5bd45" stroke-width="12"/>
  <path d="M496 333 Q405 320 288 378" fill="none" stroke="#f5bd45" stroke-width="12"/>
  <path d="M280 204 L280 370" fill="none" stroke="#ffd85f" stroke-width="12"/>

  <!-- magnifying glass ring -->
  <circle cx="300" cy="176" r="105" fill="#9b5410" fill-opacity=".33" stroke="#5a2a06" stroke-width="24" opacity=".65"/>
  <circle cx="300" cy="176" r="100" fill="#7f470d" fill-opacity=".22" stroke="url(#gold)" stroke-width="20"/>
  <circle cx="300" cy="176" r="77" fill="#b97518" fill-opacity=".18" stroke="#ffd768" stroke-width="3" opacity=".9"/>
  <g transform="rotate(-43 392 278)">
    <rect x="374" y="246" width="44" height="125" rx="20" fill="#6d3508" opacity=".55"/>
    <rect x="369" y="240" width="44" height="125" rx="20" fill="url(#gold)" stroke="#ffd968" stroke-width="3"/>
  </g>

  <!-- light bulb -->
  <g filter="url(#glow)">
    <path d="M300 112 C265 112 246 135 246 160 C246 179 257 192 270 203 C278 210 282 220 282 231 L318 231 C318 220 322 210 330 203 C343 192 354 179 354 160 C354 135 335 112 300 112 Z" fill="#6d3508" stroke="url(#gold)" stroke-width="12"/>
    <path d="M286 247 H314 M289 259 H311 M294 270 H306" stroke="url(#gold)" stroke-width="10"/>
  </g>
  <g stroke="#ffd45b" stroke-width="9">
    <path d="M300 82 V64"/><path d="M266 91 L255 76"/><path d="M334 91 L345 76"/>
    <path d="M248 116 L231 108"/><path d="M352 116 L369 108"/>
  </g>

  <!-- circuit traces -->
  <g fill="none" stroke="url(#gold)" stroke-width="11">
    <path d="M88 176 H132 V220 H184"/>
    <path d="M88 241 H146 V266 H208"/>
    <path d="M118 300 H164 V292 H218"/>
  </g>
  <g fill="#7b3d09" stroke="url(#gold)" stroke-width="9">
    <circle cx="88" cy="176" r="13"/><circle cx="184" cy="220" r="13"/>
    <circle cx="88" cy="241" r="13"/><circle cx="208" cy="266" r="13"/>
    <circle cx="118" cy="300" r="13"/><circle cx="218" cy="292" r="13"/>
  </g>

  <!-- highlights -->
  <path d="M73 170 Q150 153 249 202" fill="none" stroke="#fff1a3" stroke-width="4" opacity=".75"/>
  <path d="M487 170 Q410 153 311 202" fill="none" stroke="#fff1a3" stroke-width="4" opacity=".75"/>
  <circle cx="300" cy="176" r="100" fill="none" stroke="#fff3aa" stroke-width="4" opacity=".7"/>
</g>
</svg>